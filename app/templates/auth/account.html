{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <p class="muted">Signed in as <strong>{{ current_user.username }}</strong> ({{ ROLES[current_user.role] }}).</p>
  <form method="post" class="form">
    {{ csrf() }}
    <label>Current password <input name="current_password" type="password" required></label>
    <label>New password (8+ characters) <input name="new_password" type="password" minlength="8" required></label>
    <button class="btn">Update password</button>
  </form>
</div>
{% endblock %}
