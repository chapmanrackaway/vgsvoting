# Run the whole stack (app + PostgreSQL) on any machine with Docker:
#   SECRET_KEY=change-me docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vgs
      POSTGRES_PASSWORD: vgs
      POSTGRES_DB: vgs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgs"]
      interval: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vgs:vgs@db:5432/vgs
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    ports:
      - "8080:8080"
volumes:
  pgdata:
