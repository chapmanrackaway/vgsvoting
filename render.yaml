# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/chapmanrackaway/vgsvoting
# Creates the web app plus a PostgreSQL database and wires them together.
services:
  - type: web
    name: vgs-tracker
    runtime: python
    plan: starter            # paid plan stays awake; "free" sleeps after 15 idle minutes
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TIMEZONE
        value: America/New_York
      - key: DATABASE_URL
        fromDatabase:
          name: vgs-db
          property: connectionString
databases:
  - name: vgs-db
    plan: basic-256mb        # "free" databases are deleted after 30 days
